<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buttplug コントローラー</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #111; color: #f5f5f5; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  button { font-size: 16px; padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; width: 100%; background:#333; color:#fff; }
  button:disabled { opacity: .4; }
  #initBtn { background: #444; font-weight: bold; }
  #scanBtn { background: #e75480; color: #fff; font-weight: bold; }
  #stopAllBtn { background: #d32f2f; color: #fff; font-weight: bold; }
  #status { font-size: 14px; }
  #status .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#888; margin-right:6px; }
  #status.on .dot { background:#4caf50; }
  .devName { font-size: 17px; font-weight: bold; margin-bottom: 8px; }
  .sliderRow { margin: 14px 0; }
  .sliderRow .label { font-size: 14px; color:#aaa; display:flex; justify-content:space-between; margin-bottom: 6px; }
  .sliderRow .label b { color:#ffd54f; font-size:16px; }
  input[type=range] { width: 100%; height: 36px; }
  .btnRow { display:flex; gap:8px; }
  .btnRow button { flex:1; }
  #log { font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow-y: auto; color: #9f9; }
  .hidden { display: none; }
  .smallBtn { width:auto; padding: 6px 12px; font-size: 12px; }
</style>
</head>
<body>
<h1>Buttplug コントローラー</h1>

<div class="card">
  <div id="status"><span class="dot"></span><span id="statusText">未起動</span></div>
  <div style="height:12px"></div>
  <button id="initBtn">Buttplug を起動</button>
  <div style="height:10px"></div>
  <button id="scanBtn" disabled>デバイスを探す</button>
  <div style="height:10px"></div>
  <button id="stopAllBtn">全部止める</button>
</div>

<div id="devices"></div>

<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
    <span style="font-size:13px;color:#aaa;">ログ</span>
    <button class="smallBtn" id="copyLogBtn">ログをすべてコピー</button>
  </div>
  <div id="log"></div>
  <textarea id="manualCopy" class="hidden" style="width:100%;height:80px;"></textarea>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
var logLines = [];
function log(msg){
  var t = new Date();
  var line = '[' + ('0'+t.getHours()).slice(-2) + ':' + ('0'+t.getMinutes()).slice(-2) + ':' + ('0'+t.getSeconds()).slice(-2) + '] ' + msg;
  logLines.push(line);
  $('log').textContent += line + '\n';
  $('log').scrollTop = 1e6;
}
$('copyLogBtn').addEventListener('click', function(){
  var text = 'Buttplug コントローラー ログ\n日時: ' + new Date().toLocaleString('ja-JP') + '\n---\n' + logLines.join('\n');
  function fallback(){
    var ta = $('manualCopy');
    ta.classList.remove('hidden');
    ta.value = text;
    ta.select();
    log('手動コピー欄を表示しました');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ log('ログをコピーしました'); }, fallback);
  } else fallback();
});

var client = null;
var BP = null, WASM = null;

$('initBtn').addEventListener('click', function(){
  if (client) return;
  $('initBtn').disabled = true;
  $('statusText').textContent = '読み込み中…（数MBあります）';
  log('ライブラリを読み込んでいます…');
  Promise.all([
    import('https://cdn.jsdelivr.net/npm/buttplug@3.2.1/dist/web/buttplug.mjs'),
    import('https://cdn.jsdelivr.net/npm/buttplug-wasm@2.0.1/dist/buttplug-wasm.mjs')
  ]).then(function(mods){
    BP = mods[0]; WASM = mods[1];
    log('ライブラリ読み込みOK');
    client = new BP.ButtplugClient('Muse Controller');
    client.addListener('deviceadded', onDeviceAdded);
    client.addListener('deviceremoved', function(dev){
      log('デバイスが外れました: ' + dev.name);
      var el = $('dev-' + dev.index);
      if (el) el.remove();
    });
    client.addListener('disconnect', function(){
      $('status').className = '';
      $('statusText').textContent = '切断';
      $('scanBtn').disabled = true;
      log('Buttplugから切断されました');
    });
    return client.connect(new WASM.ButtplugWasmClientConnector());
  }).then(function(){
    $('status').className = 'on';
    $('statusText').textContent = 'Buttplug 起動済み';
    $('scanBtn').disabled = false;
    log('Buttplug 起動OK。「デバイスを探す」が使えます');
  }).catch(function(err){
    $('initBtn').disabled = false;
    $('statusText').textContent = '起動失敗';
    log('起動エラー: ' + (err && err.message ? err.message : err));
  });
});

$('scanBtn').addEventListener('click', function(){
  if (!client) return;
  log('スキャン開始…（一覧からデバイスを選んでください）');
  client.startScanning().catch(function(err){
    log('スキャンエラー: ' + (err && err.message ? err.message : err));
  });
});

$('stopAllBtn').addEventListener('click', function(){
  if (!client) return;
  client.stopAllDevices().then(function(){ log('全部止めました'); }).catch(function(){});
  var inputs = document.querySelectorAll('input[type=range]');
  for (var i=0;i<inputs.length;i++){ inputs[i].value = 0; inputs[i].dispatchEvent(new Event('input')); }
});

function onDeviceAdded(dev){
  log('デバイス追加: ' + dev.name + ' (index ' + dev.index + ')');
  var attrs = [];
  try {
    var sc = dev.messageAttributes && dev.messageAttributes.ScalarCmd;
    if (sc) attrs = sc;
  } catch(e) {}
  log('ScalarCmd: ' + attrs.length + ' 件');
  for (var i=0;i<attrs.length;i++){
    log('  #' + attrs[i].Index + ' ' + attrs[i].ActuatorType + ' steps=' + attrs[i].StepCount + ' ' + (attrs[i].FeatureDescriptor || ''));
  }

  var card = document.createElement('div');
  card.className = 'card';
  card.id = 'dev-' + dev.index;
  var html = '<div class="devName">' + dev.name + '</div>';

  // ActuatorType ごとにグループ化（同じ種類の出力は配列で送る）
  var groups = {};
  attrs.forEach(function(a){
    if (a.ActuatorType !== 'Vibrate' && a.ActuatorType !== 'Oscillate') return;
    if (!groups[a.ActuatorType]) groups[a.ActuatorType] = [];
    groups[a.ActuatorType].push(a);
  });
  var types = Object.keys(groups);
  if (types.length === 0) {
    html += '<div style="color:#aaa;font-size:14px;">操作できる出力（振動／吸引）が見つかりませんでした。ログを確認してください。</div>';
  }
  types.forEach(function(type){
    groups[type].sort(function(a,b){ return a.Index - b.Index; });
    groups[type].forEach(function(a, pos){
      var label = (a.FeatureDescriptor || (type === 'Vibrate' ? '振動' : '吸引・脈動')) + (groups[type].length > 1 ? ' ' + (pos+1) : '');
      html += '<div class="sliderRow"><div class="label"><span>' + label + '（0〜' + a.StepCount + '）</span><b id="val-' + dev.index + '-' + type + '-' + a.Index + '">0</b></div>' +
        '<input type="range" min="0" max="' + a.StepCount + '" step="1" value="0" data-type="' + type + '" data-pos="' + pos + '" data-idx="' + a.Index + '"></div>';
    });
  });
  html += '<div class="btnRow"><button data-stop="' + dev.index + '">このデバイスを止める</button></div>';
  card.innerHTML = html;
  $('devices').appendChild(card);

  var state = {};
  types.forEach(function(type){ state[type] = groups[type].map(function(){ return 0; }); });

  card.querySelectorAll('input[type=range]').forEach(function(input){
    input.addEventListener('input', function(){
      var type = input.getAttribute('data-type');
      var pos = Number(input.getAttribute('data-pos'));
      var idx = input.getAttribute('data-idx');
      var steps = Number(input.max);
      state[type][pos] = Number(input.value) / steps;
      $('val-' + dev.index + '-' + type + '-' + idx).textContent = input.value;
      var arr = state[type].slice();
      var p = (type === 'Vibrate') ? dev.vibrate(arr) : dev.oscillate(arr);
      if (p && p.catch) p.catch(function(err){ log('送信エラー: ' + (err && err.message ? err.message : err)); });
      log(dev.name + ' ' + type + ' → ' + arr.map(function(v){ return Math.round(v*100)/100; }).join(', '));
    });
  });
  card.querySelector('[data-stop]').addEventListener('click', function(){
    dev.stop().catch(function(){});
    card.querySelectorAll('input[type=range]').forEach(function(inp){ inp.value = 0; inp.dispatchEvent(new Event('input')); });
    log(dev.name + ' を止めました');
  });
}

log('ページを読み込みました');
</script>
</body>
</html>
