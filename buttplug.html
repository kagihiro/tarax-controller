<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tara X コントローラー</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #111; color: #f5f5f5; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  button { font-size: 16px; padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; width: 100%; background:#333; color:#fff; }
  button:disabled { opacity: .4; }
  #connectBtn { background: #e75480; color: #fff; font-weight: bold; }
  #stopAllBtn { background: #d32f2f; color: #fff; font-weight: bold; }
  #status { font-size: 14px; }
  #status .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#888; margin-right:6px; }
  #status.on .dot { background:#4caf50; }
  .note { font-size: 13px; color: #ccc; line-height: 1.6; }
  .note code { color: #ffd54f; }
  .sliderRow { margin: 14px 0; }
  .sliderRow .label { font-size: 14px; color:#aaa; display:flex; justify-content:space-between; margin-bottom: 6px; }
  .sliderRow .label b { color:#ffd54f; font-size:16px; }
  input[type=range] { width: 100%; height: 36px; }
  #log { font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow-y: auto; color: #9f9; }
  .hidden { display: none; }
  .smallBtn { width:auto; padding: 6px 12px; font-size: 12px; }
  .controls-off { opacity: .45; pointer-events: none; }
</style>
</head>
<body>
<h1>Tara X コントローラー</h1>

<div class="card">
  <div id="status"><span class="dot"></span><span id="statusText">未接続</span></div>
  <div style="height:12px"></div>
  <p class="note">SX218A（Tara X）へ直接送ります。振動 1 は <b>55 03 00 00 01 01</b>、振動 3 は <b>55 03 00 00 0A 01</b> です。吸引は 0〜3 のままです。</p>
  <button id="connectBtn">デバイスを接続</button>
</div>

<div class="card" id="controls">
  <div class="sliderRow">
    <div class="label"><span>振動（弱 1 / 中 2 / 強 3）</span><b id="vibeVal">0</b></div>
    <input id="vibeRange" type="range" min="0" max="3" step="1" value="0">
  </div>
  <div class="sliderRow">
    <div class="label"><span>吸引（0〜3）</span><b id="suckVal">0</b></div>
    <input id="suckRange" type="range" min="0" max="3" step="1" value="0">
  </div>
  <button id="stopAllBtn">全部止める</button>
</div>

<div class="card">
  <p class="note">最後のバイトを <code>03</code> から <code>0A</code> に変えても強さは変わりません。オンになるパケットは 5 バイト目がいつも <code>01</code> だったので、強さはそこへ入れています。吸引は <code>55 09 00 00 [0〜3] FF</code> です。</p>
</div>

<div class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
    <span style="font-size:13px;color:#aaa;">ログ</span>
    <button class="smallBtn" id="copyLogBtn">ログをすべてコピー</button>
  </div>
  <div id="log"></div>
  <textarea id="manualCopy" class="hidden" style="width:100%;height:80px;"></textarea>
</div>

<script>
var SERVICE = '0000ffe0-0000-1000-8000-00805f9b34fb';
var TX_CHAR = '0000ffe1-0000-1000-8000-00805f9b34fb';
var RX_CHAR = '0000ffe2-0000-1000-8000-00805f9b34fb';

var $ = function(id){ return document.getElementById(id); };
var logLines = [];
function log(msg){
  var t = new Date();
  var line = '[' + ('0'+t.getHours()).slice(-2) + ':' + ('0'+t.getMinutes()).slice(-2) + ':' + ('0'+t.getSeconds()).slice(-2) + '] ' + msg;
  logLines.push(line);
  $('log').textContent += line + '\n';
  $('log').scrollTop = 1e6;
}
function hex(bytes){
  return Array.prototype.map.call(bytes, function(b){ return ('0'+b.toString(16)).slice(-2).toUpperCase(); }).join(' ');
}
$('copyLogBtn').addEventListener('click', function(){
  var text = 'Tara X コントローラー ログ\n日時: ' + new Date().toLocaleString('ja-JP') + '\n---\n' + logLines.join('\n');
  function fallback(){
    var ta = $('manualCopy');
    ta.classList.remove('hidden');
    ta.value = text;
    ta.select();
    log('手動コピー欄を表示しました');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ log('ログをコピーしました'); }, fallback);
  } else fallback();
});

// ffe1 は writeWithoutResponse 専用。
// 振動と吸引を続けて送ると、後のコマンドが先のコマンドを消す。
// 動かした方だけ送る。両方止めるときだけ、40ms 空けて順に送る。
// 最終バイトを変えても体感が同じだった。オン中のパケットは 5 バイト目が 01 で固定。
// 強さは 5 バイト目へ入れる。1/2/3 → 01/05/0A。末尾の 01 はオンの印。
var VIBE_SPEED = [0x00, 0x01, 0x05, 0x0A];
function vibePacket(level){
  level = Math.max(0, Math.min(3, level|0));
  var speed = VIBE_SPEED[level];
  if (speed === 0) return [0x55, 0x03, 0x00, 0x00, 0x00, 0x00];
  return [0x55, 0x03, 0x00, 0x00, speed, 0x01];
}
function suckPacket(level){
  level = Math.max(0, Math.min(3, level|0));
  return [0x55, 0x09, 0x00, 0x00, level, 0xff];
}

var device = null;
var txChar = null;
var writeChain = Promise.resolve();
var levels = { vibe: 0, suck: 0 };

function setConnected(on){
  $('status').className = on ? 'on' : '';
  $('statusText').textContent = on ? '接続中: SX218A' : '未接続';
  $('connectBtn').textContent = on ? '切断する' : 'デバイスを接続';
  $('controls').className = on ? 'card' : 'card controls-off';
}

function enqueueWrite(bytes, label){
  writeChain = writeChain.then(function(){
    if (!txChar) { log(label + ' — 未接続のため送信をスキップしました'); return; }
    var data = new Uint8Array(bytes);
    log(label + ' → ' + hex(data));
    var write = txChar.writeValueWithoutResponse || txChar.writeValue;
    if (typeof write !== 'function') throw new Error('書き込み関数がありません');
    return write.call(txChar, data);
  }).then(function(){
    return new Promise(function(r){ setTimeout(r, 40); });
  }).catch(function(err){
    log(label + ' 書き込みエラー: ' + (err && err.message ? err.message : err));
  });
  return writeChain;
}

function sendVibe(){
  enqueueWrite(vibePacket(levels.vibe), '振動 ' + levels.vibe);
}
function sendSuck(){
  enqueueWrite(suckPacket(levels.suck), '吸引 ' + levels.suck);
}

function render(){
  $('vibeRange').value = levels.vibe;
  $('suckRange').value = levels.suck;
  $('vibeVal').textContent = levels.vibe;
  $('suckVal').textContent = levels.suck;
}

$('vibeRange').addEventListener('input', function(){
  levels.vibe = Number($('vibeRange').value);
  $('vibeVal').textContent = levels.vibe;
  sendVibe();
});
$('suckRange').addEventListener('input', function(){
  levels.suck = Number($('suckRange').value);
  $('suckVal').textContent = levels.suck;
  sendSuck();
});
$('stopAllBtn').addEventListener('click', function(){
  levels.vibe = 0;
  levels.suck = 0;
  render();
  sendVibe();
  sendSuck();
  log('全部止めました');
});

function onDisconnected(){
  txChar = null;
  setConnected(false);
  log('切断されました');
}

$('connectBtn').addEventListener('click', function(){
  if (device && device.gatt && device.gatt.connected) {
    device.gatt.disconnect();
    return;
  }
  if (!navigator.bluetooth) {
    log('このブラウザでは Web Bluetooth が使えません。Bluefy で開いてください。');
    return;
  }
  log('デバイスを検索します。一覧から SX218A を選んでください。');
  var req;
  try {
    // フィルタは名前だけ。サービスを混ぜると Bluefy で一覧が出ない。
    req = navigator.bluetooth.requestDevice({
      filters: [{ name: 'SX218A' }],
      optionalServices: [SERVICE]
    });
  } catch (e) {
    req = Promise.reject(e);
  }
  req.then(function(dev){
    device = dev;
    log('選択: ' + (dev.name || '(名前なし)'));
    device.addEventListener('gattserverdisconnected', onDisconnected);
    return device.gatt.connect();
  }).then(function(server){
    log('GATT 接続 OK。サービス ffe0 を取得します。');
    return server.getPrimaryService(SERVICE);
  }).then(function(service){
    return service.getCharacteristic(TX_CHAR).then(function(ch){
      txChar = ch;
      var props = ch.properties || {};
      log('書き込み特性 ffe1 を取得しました。write=' + !!props.write + ' / writeWithoutResponse=' + !!props.writeWithoutResponse);
      setConnected(true);
      log('接続できました。スライダーで操作できます。');
      if (levels.vibe > 0) sendVibe();
      if (levels.suck > 0) sendSuck();
      return service.getCharacteristic(RX_CHAR).then(function(rx){
        if (rx.properties && rx.properties.notify) {
          return rx.startNotifications().then(function(){
            rx.addEventListener('characteristicvaluechanged', function(ev){
              log('受信 ← ' + hex(new Uint8Array(ev.target.value.buffer)));
            });
            log('受信特性 ffe2 の通知を有効にしました。');
          }).catch(function(){});
        }
      }).catch(function(){ log('受信特性 ffe2 はありません（問題ありません）。'); });
    });
  }).catch(function(err){
    if (err && err.name === 'NotFoundError') {
      log('デバイスが選ばれませんでした。電源と公式アプリの終了を確認してください。');
    } else {
      log('接続エラー: ' + (err && err.message ? err.message : err));
    }
    setConnected(false);
  });
});

setConnected(false);
log('ページを読み込みました。Bluefy で「デバイスを接続」を押してください。');
</script>
</body>
</html>
